{% assign t = site.data.i18n[page.lang] %}
<nav aria-label="{{ t.lang_label | default: 'Language' }}" class="flex items-center gap-1 ml-2">
  {% for lang in site.languages %}
    {% assign target = site.pages | where: "ref", page.ref | where: "lang", lang | first %}
    {% if target %}
      <a href="{{ target.url | prepend: site.baseurl }}"
         class="px-2 py-1 text-xs font-medium rounded transition-colors
         {% if lang == page.lang %}bg-jam-primary text-white{% else %}text-slate-500 hover:text-jam-primary dark:text-slate-400 dark:hover:text-jam-primary{% endif %}"
         {% if lang == page.lang %}aria-current="page"{% endif %}>
        {{ lang | upcase }}
      </a>
    {% endif %}
  {% endfor %}
</nav>
