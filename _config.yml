title: JamSite
description: "Modern Jekyll + Svelte 5 hybrid static site"
url: ""
baseurl: ""

languages: ["tr", "en"]
default_lang: "tr"

collections:
  pages:
    output: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-default-layout

exclude:
  - node_modules/
  - src/
  - scripts/
  - vite.config.js
  - package.json
  - package-lock.json
  - claude.md
  - Architecture.md
  - Styles.md
  - process.md
  - Gemfile
  - Gemfile.lock
  - install.sh
  - start.sh

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      image: /assets/img/og-default.png
      lang: "tr"
  - scope:
      path: "_pages/tr"
      type: "pages"
    values:
      lang: "tr"
  - scope:
      path: "_pages/en"
      type: "pages"
    values:
      lang: "en"
  - scope:
      path: "_pages/products/tr"
      type: "pages"
    values:
      layout: "product"
      lang: "tr"
  - scope:
      path: "_pages/products/en"
      type: "pages"
    values:
      layout: "product"
      lang: "en"
  - scope:
      path: "_posts/tr"
    values:
      layout: "post"
      lang: "tr"
  - scope:
      path: "_posts/en"
    values:
      layout: "post"
      lang: "en"
      permalink: /en/:title/
